
version: "3.8"
services:
  web:
    build: .
    ports:
      - "443:443"
    environment:
      # WEAK: TLS 1.0
      - SSL_PROTOCOL=TLSv1.0
      - MIN_TLS_VERSION=1.0
      - SSL_VERIFY=false
      - INSECURE_SKIP_VERIFY=true
      - RSA_BITS=1024
    volumes:
      - ./config/tls_policy.yaml:/etc/tls_policy.yaml
  api:
    image: vulnerable-crypto-api:latest
    environment:
      - SSL_CERT_VERIFY=no
      - TLS_VERSION=1.1
