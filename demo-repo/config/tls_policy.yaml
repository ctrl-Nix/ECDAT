
# WEAK: TLS 1.0 configuration
tls_version: "TLSv1.0"
min_protocol: "TLSv1.0"
ssl_protocol: "TLSv1.0"

# WEAK: TLS 1.1 configuration
tls_min_version: "1.1"
minimum_tls_version: "TLSv1.1"

# WEAK: Weak cipher suites
cipher_suites:
  - "TLS_RSA_WITH_RC4_128_SHA"
  - "TLS_RSA_WITH_3DES_EDE_CBC_SHA"
  - "TLS_RSA_WITH_DES_CBC_SHA"
  - "TLS_ECDHE_RSA_WITH_RC4_128_SHA"
ssl_ciphers: "RC4-SHA:DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA"

# OK: TLS 1.3 configuration
strong_tls_version: "TLSv1.3"
strong_cipher_suites:
  - "TLS_AES_256_GCM_SHA384"
  - "TLS_CHACHA20_POLY1305_SHA256"

# WEAK: Certificate verification disabled
verify_ssl: false
ssl_verify: false
insecure_skip_verify: true
skip_verify: true

# WEAK: RSA-1024 key size
rsa_bits: 1024
rsa_key_size: 1024
key_size: 1024
