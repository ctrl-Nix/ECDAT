
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-policy
data:
  tls_version: "1.0"
  min_protocol: "TLSv1.0"
  ssl_protocols: "TLSv1 TLSv1.1"
  ssl_ciphers: "RC4-SHA:DES-CBC3-SHA"
  verify_ssl: "false"
  insecure_skip_verify: "true"
  rsa_bits: "1024"
  allow_weak_ciphers: "yes"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: strong-tls-policy
data:
  tls_version: "1.3"
  ssl_protocols: "TLSv1.3"
  ssl_ciphers: "TLS_AES_256_GCM_SHA384"
  verify_ssl: "true"
  rsa_bits: "4096"
