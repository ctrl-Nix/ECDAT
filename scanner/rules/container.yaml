# scanner/rules/container.yaml
# Container package-inventory rules — maps installed OS and language packages to crypto library assets.

schema: 1
description: "Container package-inventory rules — maps installed packages to crypto library assets."
language: container
rules:
  - ecosystem: deb
    package: libssl3
    library: openssl
    algorithm: RSA
    primitive: publicKeyEncryption
    weak_by_default: false

  - ecosystem: deb
    package: libssl1.1
    library: openssl
    algorithm: RSA
    primitive: publicKeyEncryption
    weak_by_default: false

  - ecosystem: deb
    package: openssl
    library: openssl
    algorithm: RSA
    primitive: publicKeyEncryption
    weak_by_default: false

