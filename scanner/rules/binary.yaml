# scanner/rules/binary.yaml
# Declarative detection rules for binary scanning (BIN feature).
# Loaded by scanner.multilang_engine.load_rules() via standard language: + rules: schema.

language: "binary"
rules:
  # ─── Tier 1: Symbols (Imported / Exported / Dynamic Symbols) ─────────────────

  - tier: 1
    match_type: "symbol"
    match_pattern: "MD5_Init"
    algorithm: "MD5"
    primitive: "hash"
    library: "OpenSSL/libcrypto"
    weak_by_default: true
    expected_format: ["ELF", "PE", "MachO"]

  - tier: 1
    match_type: "symbol"
    match_pattern: "MD5_Update"
    algorithm: "MD5"
    primitive: "hash"
    library: "OpenSSL/libcrypto"
    weak_by_default: true
    expected_format: ["ELF", "PE", "MachO"]

  - tier: 1
    match_type: "symbol"
    match_pattern: "EVP_md5"
    algorithm: "MD5"
    primitive: "hash"
    library: "OpenSSL/libcrypto"
    weak_by_default: true
    expected_format: ["ELF", "PE", "MachO"]

  - tier: 1
    match_type: "symbol"
    match_pattern: "SHA1_Init"
