  # ─── Tier 2: Constant Signatures ─────────────────────────────────────────────

  - tier: 2
    match_type: "constant"
    match_pattern_hex: "637c777bf26b6fc53001672bfed7ab76"
    algorithm: "AES"
    primitive: "encrypt"
    library: "unknown"
    weak_by_default: false

  - tier: 2
    match_type: "constant"
    match_pattern_hex: "0123456789abcdeffedcba9876543210"
    algorithm: "MD5"
