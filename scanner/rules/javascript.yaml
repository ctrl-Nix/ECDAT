language: "javascript"
rules:
  # Hashes
  - match_object: "crypto"
    match_method: "createHash"
    match_arg_contains: "md5"
    algorithm: "MD5"
    primitive: "hash"
    weak_by_default: true
    expected_module: "crypto"
  
  - match_object: "crypto"
    match_method: "createHash"
    match_arg_contains: "sha1"
    algorithm: "SHA-1"
    primitive: "hash"
    weak_by_default: true
    expected_module: "crypto"
    
  - match_object: "crypto"
    match_method: "createHash"
    match_arg_contains: "sha256"
    algorithm: "SHA-256"
    primitive: "hash"
    weak_by_default: false
    expected_module: "crypto"

  # Ciphers
  - match_object: "crypto"
    match_method: "createCipheriv"
    match_arg_contains: "des"
    algorithm: "DES"
    primitive: "block-cipher"
    weak_by_default: true
    expected_module: "crypto"

  - match_object: "crypto"
    match_method: "createCipheriv"
    match_arg_contains: "aes"
    algorithm: "AES"
    primitive: "block-cipher"
    weak_by_default: false
    expected_module: "crypto"

  - match_object: "crypto"
    match_method: "createCipheriv"
    match_arg_contains: "rc4"
    algorithm: "RC4"
    primitive: "stream-cipher"
    weak_by_default: true
    expected_module: "crypto"

  # Key Generators (Asymmetric)
  - match_object: "crypto"
    match_method: "generateKeyPairSync"
    match_arg_contains: "rsa"
    algorithm: "RSA"
    primitive: "pke"
    weak_by_default: false
    expected_module: "crypto"

  - match_object: "crypto"
    match_method: "generateKeyPairSync"
    match_arg_contains: "ec"
    algorithm: "ECC"
    primitive: "signature"
    weak_by_default: false
    expected_module: "crypto"

  - match_object: "crypto"
    match_method: "generateKeyPairSync"
    match_arg_contains: "dsa"
    algorithm: "DSA"
    primitive: "signature"
    weak_by_default: false
    expected_module: "crypto"

  # Signatures
  - match_object: "crypto"
    match_method: "createSign"
    match_arg_contains: "rsa"
    algorithm: "RSA"
    primitive: "signature"
    weak_by_default: false
    expected_module: "crypto"