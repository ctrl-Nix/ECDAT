server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the backend over the internal Docker network.
    # The dashboard and backend share app_net, so 'backend' resolves via Docker
    # DNS. The trailing slash on proxy_pass strips the '/api' prefix, so
    # '/api/scans' -> backend '/scans'. Because this is same-origin from the
    # browser, it avoids CORS and satisfies the CSP connect-src 'self'.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser's X-API-Key header is forwarded to the backend unchanged.
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
