worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        ssl_session_cache shared:TLS:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Strip this header on all analyst/dashboard requests. The dedicated
        # mTLS virtual host below is the only route permitted to add it.
        proxy_set_header X-ECDAT-mTLS-Verified "";

        # Reserved analyst API prefix. The backend must enforce organization-
        # scoped analyst authorization before this route is exposed publicly.
        location /api/ {
            proxy_pass http://backend:8000/;
        }

        # The existing dashboard is read-only/mocked today. It remains behind
        # this TLS ingress without any dashboard design or scan-start changes.
        location / {
            proxy_pass http://dashboard:8080;
        }
    }

    # Point a dedicated DNS name, such as ingest.example.gov, at this virtual
    # host. `ssl_verify_client on` occurs in the TLS handshake, unlike a
    # request-level header check, so a client lacking a trusted certificate
    # cannot submit an HTTP request to the agent intake endpoint at all.
    server {
        listen 8443 ssl;
        server_name agent.ecdat.local;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_client_certificate /etc/nginx/mtls-ca/agent-ca.crt;
        ssl_verify_client on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        ssl_session_cache shared:TLS_AGENT:10m;
        client_max_body_size 1m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;

        location = /agent/v1/report-bundles {
            limit_except POST { deny all; }
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-ECDAT-mTLS-Verified "SUCCESS";
            proxy_pass http://backend:8000;
        }

        location / { return 404; }
    }
}
