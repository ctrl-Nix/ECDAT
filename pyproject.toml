[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecdat"
version = "1.0.0"
description = "Enterprise Cryptographic Discovery & Assessment Tool"
requires-python = ">=3.11,<4"
dependencies = [
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
    "PyYAML>=6.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8.0",
    "pwdlib[argon2]>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20.0",
    "google-generativeai>=0.7.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "cryptography==42.0.5",
]

[project.scripts]
ecdat = "scanner.ecdat_cli:main"

[tool.setuptools]
py-modules = ["remediation_table"]

[tool.setuptools.packages.find]
include = ["api*", "db*", "scanner*"]

[tool.setuptools.package-data]
scanner = ["rules/*.yaml", "dependency_rules/*.yaml"]
