# Postgres-only compose for the DATABASE lane (Ronak).
#
# Day-1 goal: "run Postgres in Docker with one command instead of installing
# it locally." From the repo root:
#
#     docker compose up -d
#
# schema.sql is applied automatically the first time the data volume is empty
# (Postgres runs everything in /docker-entrypoint-initdb.d on init). To re-apply
# after editing schema.sql, reset the volume:  docker compose down -v && up -d.
#
# This is intentionally just the database. Karan folds it into the root
# docker-compose.yml (backend + db + frontend) later in the week.
services:
  db:
    image: postgres:16-alpine
    container_name: cbom-postgres
    environment:
      POSTGRES_USER: cbom
      POSTGRES_PASSWORD: cbom
      POSTGRES_DB: cbom
    ports:
      - "5432:5432"
    volumes:
      - cbom_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbom -d cbom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cbom_pgdata:
