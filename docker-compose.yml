services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Existing-database upgrades run this migration explicitly; this direct
      # mount makes new PostgreSQL volumes apply it in init order as well.
      - ./db/migrations/001_secure_reporting.sql:/docker-entrypoint-initdb.d/02_secure_reporting.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data_net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The official postgres entrypoint runs as root and must chown/chmod its
    # data dir and socket dir, then drop to the postgres user, before it can
    # start. cap_drop:[ALL] removes those abilities and the container crash-loops
    # ("Operation not permitted"). Grant back only the minimal capabilities the
    # entrypoint needs; the hardening (read_only rootfs, no-new-privileges, and
    # the cap_drop:[ALL] baseline) is otherwise preserved.
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      # The Compose database is accessible only on data_net. This intentionally
      # uses no TLS inside that isolated host-local network; use verify-full and
      # a CA for a remote managed PostgreSQL service.
      POSTGRES_SSL_MODE: disable
      ENABLE_LOCAL_SCAN_API: "false"
      REPORT_SYNC_REQUIRE_MTLS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [data_net, app_net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [app_net]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_started
    ports:
      - "${ECDAT_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Operators must supply organization-issued TLS material outside source
      # control. `agent-ca.crt` trusts scanning-agent client certificates only.
      - ./deploy/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./deploy/tls/server.key:/etc/nginx/tls/server.key:ro
      - ./deploy/tls/agent-ca.crt:/etc/nginx/mtls-ca/agent-ca.crt:ro
    networks: [app_net]
    user: "101:101"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]

networks:
  data_net:
    internal: true
  app_net:
    internal: true

volumes:
  pgdata:
