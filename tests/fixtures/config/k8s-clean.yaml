# k8s-clean.yaml — Kubernetes Ingress with strong TLS settings
# This file is a TEST FIXTURE for the ECDAT config engine — no weak crypto.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-ingress
spec:
  tls:
    - hosts:
        - example.com
      secretName: tls-secret
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example-svc
                port:
                  number: 443
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-config
data:
  tls_version: "TLSv1.3"
  cipher_suites: "TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384"
  ssl_verify: "true"
  rsa_bits: "4096"
